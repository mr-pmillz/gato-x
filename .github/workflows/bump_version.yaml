name: Prepare Release Branch
on:
  workflow_dispatch:
    inputs:
      new_version:
        description: Stable version, e.g. 1.5.0 (without v)
        required: true
        type: string
      kind:
        description: Release from develop, or hotfix from main
        type: choice
        options: [release, hotfix]
        default: release
permissions:
  contents: read
concurrency:
  group: gato-x-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'mr-pmillz/gato-x' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare version and changelog on a new branch
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ inputs.new_version }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: python scripts/gitflow.py prepare --kind "$RELEASE_KIND" --version "$NEW_VERSION"
