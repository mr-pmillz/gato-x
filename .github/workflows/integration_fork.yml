name: Fork PR Unit Testing
on:
  workflow_dispatch:
    inputs:
      pr_repo:
        description: Fork repository (owner/repo)
        required: true
        type: string
      pr_sha:
        description: Immutable 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate checkout identity
        env:
          PR_REPO: ${{ inputs.pr_repo }}
          PR_SHA: ${{ inputs.pr_sha }}
        run: |
          [[ "$PR_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$PR_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.pr_repo }}
          ref: ${{ inputs.pr_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,mcp]'
      # Fork code receives no integration credentials and never dispatches a runner.
      - run: python -m pytest unit_test/ --cov-fail-under=70
