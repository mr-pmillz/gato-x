name: Self-Hosted Runner for Integration Tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
    # This job creates a self-hosted runner attached to the
    # test organization.
    Integration_SH_Runner:
        if: github.repository == 'mr-pmillz/gato-x' && github.ref == 'refs/heads/main' && vars.ENABLE_LIVE_INTEGRATION == 'true'
        name: Ephemeral Self-Hosted Runner
        runs-on: ubuntu-latest
        timeout-minutes: 16
        steps:
          - name: Checkout the repo
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
          - name: Setup python
            uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
            with:
              python-version: 3.11
          - name: Configure Self-Hosted Runner
            env:
              SH_RUNNER_MANAGE_TOKEN: ${{ secrets.SH_RUNNER_MANAGE_TOKEN }}
            run: |
              pip install httpx
              mkdir actions-runner && cd actions-runner
              curl -o actions-runner-linux-x64-2.316.1.tar.gz -L https://github.com/actions/runner/releases/download/v2.316.1/actions-runner-linux-x64-2.316.1.tar.gz
              echo "d62de2400eeeacd195db91e2ff011bfb646cd5d85545e81d8f78c436183e09a8  actions-runner-linux-x64-2.316.1.tar.gz" | sha256sum --check
              tar xzf ./actions-runner-linux-x64-2.316.1.tar.gz
              python ../test/runner_helper.py register
          - name: Run without management credentials
            working-directory: actions-runner
            run: nohup ./run.sh &
          - name: Sleep
            run: python3 -c "import time; time.sleep(840)"
    SH_Runner_Cleanup:
    # Remove the registration from a fresh host. Code executed by the test
    # runner must never share a host with a later management-token step.
        name: Remove Self-Hosted Runner
        runs-on: ubuntu-latest
        needs: Integration_SH_Runner
        if: always() && needs.Integration_SH_Runner.result != 'skipped'
        steps:
          - name: Checkout the repo
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
          - name: Setup python
            uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
            with:
              python-version: 3.11
          - name: Force Remove SH Runner
            env:
              SH_RUNNER_MANAGE_TOKEN: ${{ secrets.SH_RUNNER_MANAGE_TOKEN }}
            run: |
              pip install httpx
              python test/runner_helper.py force_remove
