name: Gato-X Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      version_bumped: ${{ steps.check.outputs.version_bumped }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # Ensure access to the previous commit

      - name: Check if version has been updated
        id: check
        run: |
          PREV_VERSION=$(git show HEAD~1:pyproject.toml | grep "^version" | sed 's/version = "\(.*\)"/\1/')
          CURR_VERSION=$(grep "^version" pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Previous version: $PREV_VERSION"
          echo "Current version: $CURR_VERSION"
          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "version_bumped=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
          fi
  build_artifact:
    name: Build and upload artifact
    runs-on: ubuntu-latest
    needs: check_version
    permissions:
      id-token: write
      attestations: write
    if: needs.check_version.outputs.version_bumped == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build Binary wheel Source Tarball
        run: python3 -m build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/gato_x-*'
      - name: Store Distribution Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
  release:
    name: Publish Gato-X GitHub Release 📦
    needs: [check_version, build_artifact]
    if: needs.check_version.outputs.version_bumped == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      # This fork does not own the `gato-x` name on PyPI, so releases are
      # distributed as signed GitHub Release artifacts and as container
      # images on ghcr.io/mr-pmillz/gato-x (see docker_publish.yaml).
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: Gato-X Release v${{ needs.check_version.outputs.version }}
          body: |
            Release of version v${{ needs.check_version.outputs.version }}
          files: |
            ./dist/*.tar.gz
            ./dist/*.whl
            ./dist/*.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
